name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  customer-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:customer
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
      - name: Build Supabase customer configuration
        run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
          VITE_AUTH_PROVIDER: supabase
          VITE_SUPABASE_URL: https://senderplus-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  customer-auth-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth-browser

  django-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/test_backend.py
